apiVersion: metal3.io/v1alpha1
kind: BareMetalHost
metadata:
  name: ibi-media-probe
  namespace: ibi-preparation-probe
  annotations:
    inspect.metal3.io: disabled
spec:
  # Keep off until the target and masked boot ISO have been checked.
  online: false
  externallyProvisioned: false
  automatedCleaningMode: disabled
  bootMode: UEFI
  bootMACAddress: "02:00:00:00:00:01"
  bmc:
    address: redfish-virtualmedia+https://192.0.2.10/redfish/v1/Systems/1
    credentialsName: bmc-credentials
  image:
    url: https://iso.example.com/diagnostics/ibi-media-probe.iso
    format: live-iso
